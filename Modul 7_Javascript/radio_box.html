<html>
<head>
    <title> Mengakses Objek radio </title>
</head>
<body>
    Klik Pop Favoritmu<br>
    <form name="formTes">
        <input type="radio" name="radioMusik" value="Citypop" onclick="info()">City Pop<br>
        <input type="radio" name="radioMusik" value="Synthpop" onclick="info()">Synthpop<br>
        <input type="radio" name="radioMusik" value="Indiepop" onclick="info()">Indie Pop<br>
        <input type="radio" name="radioMusik" value="Lainnya" onclick="info()">Lainnya<br>
        <hr>
        Info: <input type="text" name="fieldMusik" size="40">
    </form>
    <script language="JavaScript">
        function info() {
            for (var i = 0; i < 4; i++) {
                if (document.formTes.radioMusik[i].checked) {

                    document.formTes.fieldMusik.value = document.formTes.radioMusik[i].value;
                }
            }
        }
    </script>
</body>
</html>
